name: Bump Interface Definitions

on:
  workflow_dispatch:
    inputs:
      version_change:
        required: true
        type: choice
        options:
        - major
        - minor
      change_description:
        description: Describe the interface-definition changes being integrated
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-interfaces:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ACTION_SETTINGS_APP_ID }}
          private-key: ${{ secrets.ACTION_SETTINGS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Git for private repo access
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      
      - name: Run update script
        id: update
        env:
          CHANGE_DESCRIPTION: ${{ inputs.change_description }}
        run: |
          scripts/update-interface-definitions.sh --${{ inputs.version_change }} --description "$CHANGE_DESCRIPTION"
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/core/Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGE_DESCRIPTION: ${{ inputs.change_description }}
          NEW_VERSION: ${{ steps.update.outputs.version }}
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create and switch to branch
          git checkout -b interface-update/${{ github.actor }}/${{ github.run_number }}

          # Commit changes
          git commit -a -m "Interface definitions updated from workflow"

          # Push
          git push origin interface-update/${{ github.actor }}/${{ github.run_number }}

          # Create PR
          pr_body=$(mktemp)
          trap 'rm -f "$pr_body"' EXIT
          printf '%s\n\n%s\n' \
            "Automated PR created from the Bump Interface Definitions workflow for version ${NEW_VERSION}." \
            "$CHANGE_DESCRIPTION" > "$pr_body"
          gh pr create \
            --title "Automated Interface Update to v${NEW_VERSION}" \
            --body-file "$pr_body" \
            --base main \
            --head interface-update/${{ github.actor }}/${{ github.run_number }}
