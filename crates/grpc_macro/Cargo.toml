[package]
name = "grpc-macro"
version = "0.3.0"
description = "Procedural macros for rust-grpc-lib: the GrpcClient derive for generated tonic clients, and the access_controlled_service, roles, any_authenticated and public attributes for service implementations"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
rust-grpc-lib = { path = "../core", features = ["server"] }
