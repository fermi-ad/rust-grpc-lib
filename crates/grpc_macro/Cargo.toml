[package]
name = "grpc-macro"
version = "0.2.0"
description = "Provides the macro for auto-deriving the internal GrpcClient trait on generated tonic structs"
edition = "2024"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
