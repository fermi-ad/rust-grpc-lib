[package]
name = "integration_tests"
version = "0.2.0"
edition = "2024"
publish = false

# A stand-in consumer: only what a real service needs. `tonic`, `prost` and
# `async_trait` come from `rust_grpc_lib`'s re-exports, and health queries
# and `StreamExt` from `rust_grpc_lib::testing`.
[dev-dependencies]
rust-grpc-lib = { path = "../core", features = ["test-util", "server"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
trybuild = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
