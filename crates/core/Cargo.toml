[package]
name = "rust-grpc-lib"
version = "7.9.0"
description = "A library to encapsulate the Fermilab-specific gRPC interface generation and transport logic for Rust projects"
repository = "https://github.com/fermi-ad/rust-grpc-lib"
edition = "2024"

# Ship the bundled .proto files so consumers can run code-gen from their own
# build.rs without knowing about the source files. env!("CARGO_MANIFEST_DIR")
# inside run_build() resolves to this crate's directory on the consumer's machine.
include = [
    "src/**/*",
    "interface-definitions/proto/**/*.proto",
]

[features]
default = ["auth"]
auth = ["dep:rust-auth-lib"]
build = ["dep:protoc-bin-vendored", "dep:tonic-prost-build"]
jwks-url = ["rust-auth-lib/jwks-url"]
unauthenticated = []
# Test helpers for consumers: claims builders, `RequestContext::for_test`, claim
# injection, span capture and the auth conformance helpers. Intended for
# `[dev-dependencies]`.
test-util = [
    "auth",
    "dep:tonic-prost",
    "dep:tracing-subscriber",
    "rust-auth-lib/test-fixtures",
]
# `trace::GrpcTraceLayer`: per-RPC spans, `RpcMethod` and `RpcSpan` extensions.
# Off by default so client-only consumers do not pull in tower or tower-http.
trace = [
    "auth",
    "dep:pin-project-lite",
    "dep:tower",
    "dep:tower-http",
]

[dependencies]
grpc-macro = { path = "../grpc_macro" }
rust-auth-lib = { git = "https://github.com/fermi-ad/rust-auth-lib", tag = "v0.4.0", optional = true }
protoc-bin-vendored = { version = "3", optional = true }
rust-env-var-lib = { git = "https://github.com/fermi-ad/rust-env-var-lib", tag = "v1.2.0" }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tonic-prost = { version = "0.14", optional = true }
tonic-prost-build = { version = "0.14", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }
pin-project-lite = { version = "0.2", optional = true }
tower = { version = "0.5", default-features = false, optional = true }
tower-http = { version = "0.6", default-features = false, features = ["trace"], optional = true }

[dev-dependencies]
# The `trace` module also compiles under `cfg(test)` without the `trace`
# feature (like `testing`), so its dependencies are repeated here.
# `http-body` is only used by its unit tests.
http-body = "1"
pin-project-lite = "0.2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time"] }
protoc-bin-vendored = "3"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
rust-auth-lib = { git = "https://github.com/fermi-ad/rust-auth-lib", tag = "v0.4.0", features = ["test-fixtures"] }
